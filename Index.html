<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is Adam late?</title>
<style>
  :root {
    --bg: #f3efe6;
    --ink: #1d1b16;
    --muted: #6b665a;
    --card: #fffdf7;
    --line: #1d1b16;
    --yes: #c8321e;
    --no: #1f7a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15140f;
      --ink: #f3efe6;
      --muted: #a39d8d;
      --card: #211f18;
      --line: #f3efe6;
      --yes: #ff6b52;
      --no: #5fd093;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }

  /* ---------- Card flip ---------- */
  .scene {
    width: min(340px, 100%);
    aspect-ratio: 3 / 4;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 28px 20px;
    text-align: center;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 18px;
    box-shadow: 8px 8px 0 var(--line);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .back { transform: rotateY(180deg); }

  .question {
    margin: 0;
    font-size: clamp(2.2rem, 11vw, 3rem);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .date {
    margin: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .answer {
    margin: 0;
    font-size: clamp(4.5rem, 26vw, 7rem);
    line-height: 0.9;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .answer.yes { color: var(--yes); }
  .answer.no  { color: var(--no); }
  .detail {
    margin: 0;
    font-size: 1.05rem;
    font-style: italic;
    color: var(--muted);
  }

  /* ---------- Buttons ---------- */
  button {
    font: inherit;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  button:hover:not(:disabled),
  button:focus-visible {
    background: var(--ink);
    color: var(--bg);
    outline: none;
  }
  button:disabled { opacity: 0.45; cursor: wait; }

  .admin {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .admin button {
    border-width: 1px;
    font-size: 0.72rem;
    padding: 9px 16px;
    color: var(--muted);
  }
  .status {
    margin: 0;
    min-height: 1.2em;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>

  <main class="scene">
    <div class="card" id="card">
      <section class="face front" id="front">
        <p class="date" id="dateFront"></p>
        <h1 class="question">Is Adam late?</h1>
        <button id="revealBtn" type="button">Reveal</button>
      </section>

      <section class="face back" id="back" aria-live="polite">
        <p class="date" id="dateBack"></p>
        <p class="answer" id="answer">…</p>
        <p class="detail" id="detail"></p>
        <button id="backBtn" type="button">Flip back</button>
      </section>
    </div>
  </main>

  <div class="admin">
    <button id="toggleBtn" type="button" disabled>Mark Adam as late today</button>
    <p class="status" id="status" role="status"></p>
  </div>

<script>
  // =====================================================================
  // CONFIGURAÇÃO: cole aqui a URL do seu Realtime Database (sem barra no fim)
  // Exemplo: "https://is-adam-late-default-rtdb.europe-west1.firebasedatabase.app"
  // =====================================================================
  const DB_URL = "https://is-adam-late-e60d0-default-rtdb.europe-west1.firebasedatabase.app/";

  // Fuso usado para decidir o que é "hoje" (igual para todos os visitantes)
  const TIME_ZONE = "Europe/Dublin";

  // ---------------------------------------------------------------------
  const ENDPOINT = DB_URL.replace(/\/+$/, "") + "/adam/lateDate.json";
  const configured = DB_URL.startsWith("https://");

  const card = document.getElementById("card");
  const front = document.getElementById("front");
  const back = document.getElementById("back");
  const revealBtn = document.getElementById("revealBtn");
  const backBtn = document.getElementById("backBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const answerEl = document.getElementById("answer");
  const detailEl = document.getElementById("detail");
  const statusEl = document.getElementById("status");

  let isLate = false;

  // Data de hoje no formato YYYY-MM-DD, sempre no fuso configurado
  function today() {
    return new Date().toLocaleDateString("en-CA", { timeZone: TIME_ZONE });
  }

  function prettyDate() {
    return new Date().toLocaleDateString("en-IE", {
      timeZone: TIME_ZONE, weekday: "short", day: "numeric", month: "short"
    });
  }

  function render() {
    answerEl.textContent = isLate ? "YES" : "NO";
    answerEl.className = "answer " + (isLate ? "yes" : "no");
    detailEl.textContent = isLate ? "Of course he is." : "Not today. So far.";
    toggleBtn.textContent = isLate ? "Undo: Adam is not late" : "Mark Adam as late today";
  }

  function setFlipped(flipped) {
    card.classList.toggle("flipped", flipped);
    // Impede foco/clique na face que está escondida
    front.inert = flipped;
    back.inert = !flipped;
  }

  // Lê a data salva; o "boolean" é simplesmente: dataSalva === hoje
  async function load() {
    const res = await fetch(ENDPOINT, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const savedDate = await res.json(); // string "YYYY-MM-DD" ou null
    isLate = savedDate === today();
    render();
  }

  // Grava a data de hoje (atrasado) ou apaga o valor (não atrasado)
  async function save(late) {
    const res = await fetch(ENDPOINT, late
      ? { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(today()) }
      : { method: "DELETE" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    isLate = late;
    render();
  }

  revealBtn.addEventListener("click", async () => {
    revealBtn.disabled = true;
    try {
      if (configured) await load();   // busca o valor mais recente antes de virar
      statusEl.textContent = configured ? "" : statusEl.textContent;
    } catch (err) {
      statusEl.textContent = "Could not reach the database (" + err.message + ").";
    }
    revealBtn.disabled = false;
    setFlipped(true);
  });

  backBtn.addEventListener("click", () => setFlipped(false));

  toggleBtn.addEventListener("click", async () => {
    toggleBtn.disabled = true;
    try {
      await save(!isLate);
      statusEl.textContent = "Saved.";
    } catch (err) {
      statusEl.textContent = "Could not save (" + err.message + ").";
    }
    toggleBtn.disabled = false;
  });

  // ---------- Início ----------
  document.getElementById("dateFront").textContent = prettyDate();
  document.getElementById("dateBack").textContent = prettyDate();
  setFlipped(false);
  render();

  if (!configured) {
    statusEl.textContent = "Setup needed: set DB_URL in index.html.";
  } else {
    load()
      .then(() => { toggleBtn.disabled = false; })
      .catch(err => { statusEl.textContent = "Could not reach the database (" + err.message + ")."; });
  }
</script>
</body>
</html>
